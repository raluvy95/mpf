name: MPF CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy mpf.py mpf_core

  release-please:
    name: Prepare release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5

  appimage:
    name: Linux AppImage
    needs: [test, release-please]
    if: >-
      ${{
        always() &&
        needs.test.result == 'success' &&
        (needs['release-please'].result == 'success' || needs['release-please'].result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Install Linux runtime and image tools
        run: sudo apt-get update && sudo apt-get install --yes mpv squashfs-tools

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Download appimagetool
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" \
            | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Set build version
        id: version
        shell: bash
        env:
          RELEASE_CREATED: ${{ needs['release-please'].outputs.release_created }}
          RELEASE_VERSION: ${{ needs['release-please'].outputs.version }}
        run: |
          if [[ "$RELEASE_CREATED" == "true" ]]; then
            echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' mpf.py)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          MPF_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build_appimage.sh

      - name: Smoke-test AppImage
        run: ./dist/mpf-${{ steps.version.outputs.version }}-x86_64.AppImage --help

      - name: Upload AppImage
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && needs['release-please'].outputs.release_created != 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mpf-linux-x86_64-appimage
          path: dist/mpf-${{ steps.version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

      - name: Upload AppImage to Release Please release
        if: ${{ needs['release-please'].outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs['release-please'].outputs.tag_name }}
          APPIMAGE: dist/mpf-${{ steps.version.outputs.version }}-x86_64.AppImage
        run: gh release upload "$RELEASE_TAG" "$APPIMAGE" --clobber

      - name: Publish manually tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && needs['release-please'].outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE: dist/mpf-${{ steps.version.outputs.version }}-x86_64.AppImage
        run: |
          gh release create "$GITHUB_REF_NAME" "$APPIMAGE" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
