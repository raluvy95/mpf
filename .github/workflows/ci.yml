name: MPF CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy mpf.py mpf_core

  release-please:
    name: Prepare release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v5
        with:
          release-type: python
          package-name: mpf

  appimage:
    name: Linux AppImage
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Linux runtime and image tools
        run: sudo apt-get update && sudo apt-get install --yes mpv squashfs-tools

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Download appimagetool
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Set build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          MPF_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build_appimage.sh

      - name: Smoke-test AppImage
        run: ./dist/mpf-${{ steps.version.outputs.version }}-x86_64.AppImage --help

      - name: Upload AppImage
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: mpf-linux-x86_64-appimage
          path: dist/mpf-${{ steps.version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE: dist/mpf-${{ steps.version.outputs.version }}-x86_64.AppImage
        run: |
          gh release create "$GITHUB_REF_NAME" "$APPIMAGE" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
